<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110b">
<meta name="robots" content="noindex">
<title>Gotcha Shootout</title>
<meta name="description" content="Finger football at the Gotcha Matcha booth.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Bowlby+One&display=swap">
<link rel="stylesheet" href="assets/3v3.css?v=12">
</head>
<body>
<!-- Screens, ids and words = mock-up rev 4 (owner yes to rev 3 ~20:52 + "fewest words", DECISIONS 12 Nov). The skin lives in 3v3.css only. -->
<main class="app" id="app">
  <button class="sbtn" id="soundBtn" aria-pressed="true" aria-label="Sound on">🔊</button>
  <button class="tbtn" id="ticketBtn" aria-label="Your prize" hidden>🎟</button>
  <!-- rev 5–8 stadium behind every screen but the match: crowd, floodlight towers, sweeping beams, camera flashes -->
  <div class="stadium" id="stadium" aria-hidden="true"><div class="crowd"></div><div class="beam l"></div><div class="beam r"></div><div class="tower l"></div><div class="tower r"></div></div>

  <section class="scr" id="s-home">
    <canvas class="bgpitch" id="bgpitch" aria-hidden="true"></canvas>
    <img class="logo" src="../assets/img/logo-lockup-white.webp" alt="Gotcha Matcha" width="132" height="40">
    <h1 class="title" aria-label="Shootout">SH<b class="ballo"></b><b class="ballo"></b>TOUT</h1>
    <span class="chip">📍 OCBC ARENA · 13–15 NOV</span>
    <div class="spacer"></div>
    <button class="btn kick" id="goJoin">▶ PLAY</button>
    <div class="ticker" id="ticker" aria-hidden="true" hidden><span id="tickerTxt"></span></div>
    <a class="small lnk" href="rules/">Rules</a>
  </section>

  <section class="scr" id="s-join" hidden>
    <h2 class="h2">Join to play</h2>
    <div class="step">
      <a class="btn y" id="tgJoin" target="_blank" rel="noopener">✈️ Telegram</a>
      <a class="btn ghost" id="igJoin" target="_blank" rel="noopener">📷 Instagram</a>
    </div>
    <p class="err" id="tgErr" role="alert" hidden>Tap one first</p>
    <div class="spacer"></div>
    <button class="btn" id="goPick">▶ Play</button>
  </section>

  <section class="scr" id="s-mode" hidden>
    <button class="mode bot" id="mSolo"><span class="mtxt"><b>🤖 VS BOT</b><span id="mSoloSub">1 goal wins</span><i class="heat" aria-label="hardest">🔥🔥🔥🔥🔥</i></span><span class="mart big" aria-hidden="true">⚽</span></button>
    <button class="mode friends" id="mMulti"><span class="mtxt"><b>👥 FRIENDS</b><span id="mMultiSub">2–4 players</span></span><span class="mart"><svg class="jersey" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 6 22 2Q32 9 42 2L54 6 64 18 54 26 50 22V62H14V22L10 26 0 18Z" fill="#6fbf4a" stroke="#0b1a10" stroke-width="2.5"/><text x="32" y="48" text-anchor="middle" font-family="Bowlby One, Impact" font-size="22" fill="#0b1a10">7</text></svg><svg class="jersey" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 6 22 2Q32 9 42 2L54 6 64 18 54 26 50 22V62H14V22L10 26 0 18Z" fill="#fff3b0" stroke="#0b1a10" stroke-width="2.5"/><text x="32" y="48" text-anchor="middle" font-family="Bowlby One, Impact" font-size="22" fill="#0b1a10">10</text></svg></span></button>
  </section>

  <!-- owner ~05:36 (§16): FRIENDS = create a game or join one; no 1 V 1 / 2 V 2 choice (2–4 players) -->
  <section class="scr" id="s-multi" hidden>
    <h2 class="h2">👥 Friends</h2>
    <button class="mode pick" id="fCreate"><span class="mtxt"><b>＋ CREATE GAME</b><span>Get a code</span></span></button>
    <button class="mode pick y" id="fJoin"><span class="mtxt"><b>🔑 JOIN GAME</b><span>Type a code</span></span></button>
    <div class="spacer"></div>
    <button class="btn ghost" id="multiBack" aria-label="Back">↩</button>
  </section>

  <section class="scr" id="s-code" hidden>
    <h2 class="h2">Code</h2>
    <form class="coderow" id="joinForm" autocomplete="off">
      <input class="codein" id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Game code">
      <button class="btn y" id="joinGo" type="submit">Join</button>
    </form>
    <p class="err" id="codeErr" role="alert" hidden>Wrong code</p>
    <div class="spacer"></div>
    <button class="btn ghost" id="codeBack" aria-label="Back">↩</button>
  </section>

  <section class="scr" id="s-lobby" hidden>
    <p class="small" id="roomKind">1 V 1</p>
    <div class="count led" id="lCount">----</div>
    <p class="small" id="roomHint">Share this code</p>
    <div class="slots" id="slots"></div>
    <div class="spacer"></div>
    <p class="small" id="roomFoot"></p>
    <button class="btn" id="startGo" hidden>▶ Start</button>
    <button class="btn y" id="vsBot" hidden>🤖 vs Bot</button>
    <button class="btn ghost" id="leaveGo">Leave</button>
  </section>

  <section class="scr" id="s-match" hidden>
    <canvas id="pitch" aria-label="Football pitch. Your finger is your player: move it to hit the ball into the goal."></canvas>
    <div class="hud"><span class="tchip m" id="hudA">MATCHA</span><span class="hscore" id="hudScore" hidden>0 – 0</span><span class="tchip yz" id="hudB">YUZU</span><span class="clock" id="clock">60</span></div>
    <div class="banner" id="banner"></div>
    <div class="hint" id="hint" aria-label="Drag your player"><span class="fing">👆</span> ↑</div>
    <div class="offb" id="offBadge" hidden>Offline · no prize</div>
  </section>

  <section class="scr" id="s-result" hidden>
    <div class="trophy" id="trophy" aria-hidden="true">🏆</div>
    <h2 class="big" id="rTitle">WIN!</h2>
    <p class="pb" id="pb" hidden></p>
    <p class="small" id="rEyebrow">1 – 0</p>
    <p class="small" id="noPrize" hidden></p>
    <div class="prize" id="prize" hidden></div>   <!-- the voucher (assets/voucher.js) -->
    <div class="spacer"></div>
    <button class="btn" id="again">↻ Again</button>
    <button class="btn ghost" id="back" aria-label="Back">↩</button>
  </section>

  <!-- kill switch / no server (CTO G1 §9.5) -->
  <section class="scr" id="s-rest" hidden>
    <img class="logo" src="../assets/img/logo-lockup-white.webp" alt="Gotcha Matcha" width="132" height="40">
    <h2 class="h2">The game is resting</h2>
    <div class="step">
      <a class="btn y" id="restTg" target="_blank" rel="noopener">✈️ Telegram</a>
      <a class="btn ghost" id="restIg" target="_blank" rel="noopener">📷 Instagram</a>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="restRetry" aria-label="Try again">↻</button>
  </section>

  <canvas class="fxl" id="fx" aria-hidden="true"></canvas>
  <!-- the prize ticket: open from 🎟 on any screen until it is used or expires (adversarial S1: a code never vanishes) -->
  <div class="sheet" id="ticket" role="dialog" aria-label="Your prize" hidden>
    <div class="prize" id="tCard"></div>
    <button class="btn ghost" id="ticketClose" aria-label="Close">✕</button>
  </div>
  <div class="pill" id="pill" hidden>Reconnecting…</div>
  <div class="pill busy" id="busy" role="status" hidden><i class="spin" aria-hidden="true"></i>Full · 1 sec</div>
  <div class="toast" id="toast" hidden></div>
  <div class="dbg" id="dbg" hidden></div>
  <div class="ribbon" id="ribbon" hidden></div>
</main>
<script src="assets/sim.js?v=7"></script>
<script src="assets/logic.js?v=10"></script>
<script src="assets/net.js?v=8"></script>
<script src="assets/fake.js?v=12"></script>
<script src="assets/ball3d.js?v=1"></script>
<script src="assets/draw.js?v=6"></script>
<script src="assets/sfx.js?v=14"></script>
<script src="assets/fx.js?v=5"></script>
<script src="assets/voucher.js?v=2"></script>
<script src="assets/game.js?v=17"></script>
</body>
</html>
